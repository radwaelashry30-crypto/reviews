name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run test suite
        run: cd backend && pytest -q

      # Guards derived directly from real bugs caught in this project's
      # technical review -- see backend/scripts/*.py for what each checks.
      - name: No local machine paths committed
        run: cd backend && python scripts/check_no_local_paths.py

      - name: Published metrics match the shipped checkpoint
        run: cd backend && python scripts/verify_metrics_freshness.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t baseera-api .

      - name: Boot and health-check the container
        run: |
          docker run --rm -d -p 8000:8000 --name api baseera-api
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 5
          done
          echo "Health check never succeeded"
          docker logs api
          exit 1
