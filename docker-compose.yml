services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - FRONTEND_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      # Optional -- comment out (or leave db unstarted) to run without a
      # database, same as any other deployment. See DATABASE_SETUP.md.
      - DATABASE_URL=postgresql://baseera:baseera@db:5432/baseera
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional, local-dev only. Not required to run the app -- see the
  # DATABASE_URL comment above. Comment this whole service out (and the
  # backend's `depends_on: db`) if you don't want a database at all.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=baseera
      - POSTGRES_PASSWORD=baseera
      - POSTGRES_DB=baseera
    ports:
      - "5432:5432"
    volumes:
      - baseera_pgdata:/var/lib/postgresql/data

volumes:
  baseera_pgdata:
